<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*">
  <!--TOKEN-->
  <title>Cazung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <section id="chat" class="panel interactive hidden" aria-label="Chat với Cazung">
      <header class="chat-head">
        <span class="dot" id="status-dot"></span>
        <span class="title">Cazung <span class="heart">♥</span></span>
        <span class="sub" id="status-text">đang kết nối…</span>
        <div class="head-actions">
          <button id="btn-memory" type="button" title="Bộ nhớ của Cazung">🧠</button>
          <button id="btn-new" type="button" title="Cuộc trò chuyện mới">✚</button>
          <button id="btn-close" type="button" title="Đóng (Esc)">✕</button>
        </div>
      </header>

      <div id="messages" class="scroll"></div>

      <div id="memory-view" class="scroll hidden">
        <nav class="tabs" id="mem-tabs">
          <button data-tab="profile" class="active">Về bạn</button>
          <button data-tab="events">Ký ức</button>
          <button data-tab="lesson">Bài học</button>
          <button data-tab="skill">Kỹ năng</button>
          <button data-tab="stats">Thống kê</button>
        </nav>
        <form id="mem-add" class="mem-add">
          <input id="mem-input" placeholder="Dạy Cazung điều gì đó về bạn…" autocomplete="off">
          <button type="submit">Nhớ</button>
        </form>
        <div id="mem-list"></div>
      </div>

      <form id="composer">
        <textarea id="input" rows="1" placeholder="Nhắn cho Cazung…" title="Enter để gửi · Shift+Enter xuống dòng · /help xem lệnh"></textarea>
        <button id="send" type="submit" title="Gửi">➤</button>
      </form>
    </section>

    <div id="bubble" class="interactive hidden"></div>
    <canvas id="pet" class="interactive" title=""></canvas>
  </div>

  <script src="sprite.js"></script>
  <script src="markdown.js"></script>
  <script src="pet.js"></script>
  <script src="chat.js"></script>
  <script src="app.js"></script>
</body>
</html>
